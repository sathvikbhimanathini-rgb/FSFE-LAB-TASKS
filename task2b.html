<!DOCTYPE html>
<html>
    <head>
        <title>Employee Registration Form</title>
    </head>
    <body bgcolor="lightyellow">
        <h1>Employee Registration Form</h1>
        <form>
            <label>Employee Name:</label>
            <input type="text" placeholder="Enter your name" >
            <br><br>

            <label>Password:</label>
            <input type="password" name="password" required>
            <br><br>

            <label>Email:</label>
            <input type="email" name="email">
            <br><br>

            <label>Mobile Number:</label>
            <input type="number" name="mobile number" >
            <br><br>

            <label>Age:</label>
            <input type="number" name="age" >
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob">
            <br><br>

            <label>Preferred Interview Time:</label>
            <input type="time" name="interview time" >
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>

            <label>Skills:</label>
            <input type="checkbox" name="skill">HTML
            <input type="checkbox" name="skill">CSS
            <input type="checkbox" name="skill">JavaScript
            <br><br>

            <label>Select Department:</label>
            <select name="department">
                <option>HR</option>
                <option>IT</option>
                <option>Finance</option>
                <option>Marketing</option>
            </select>
            <br><br>

            <label>Upload Resume:</label>
            <input type="file" name="resume">
            <br><br>

            <label>Address:</label>
            <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
            <br><br>

            <label>Work Experience:</label>
            <input type="range" name="experience">
            <br><br>

            <label>LinkedIn Profile</label>
            <input type="url" placeholder="Enter LinkedIn URL">
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">

        </form>
    </body>
</html>
